name=Loom Trace Heap
version=1.0.0
author=OPEnSLab-OSU
maintainer=OPEnSLab-OSU
sentence=Optional sketch-selected allocator capture for Loom tracing.
paragraph=Adds GNU newlib allocator hooks only when LOOM_TRACE and LOOM_TRACE_HEAP select this library. The empty precompiled archive enables Arduino library-scoped linker flags; hook code is compiled from reviewed Loom source.
category=Other
url=https://github.com/OPEnSLab-OSU/Loom-V4/
architectures=samd
includes=Loom_TraceHeapLink.h
precompiled=true
ldflags=-Wl,--wrap=malloc,--wrap=calloc,--wrap=realloc,--wrap=free,--wrap=_malloc_r,--wrap=_calloc_r,--wrap=_realloc_r,--wrap=_free_r
