# flash_j18.cfg
# ATSAMD21J18 OpenOCD flash config for ST-LINK V2 over SWD.
#
# Put this file next to the .bin you want to flash.
#
# Run:
#   openocd -f flash_j18.cfg
#
# Wiring:
#   ST-LINK SWDIO -> SAMD21 PA31 / SWDIO
#   ST-LINK SWCLK -> SAMD21 PA30 / SWCLK
#   ST-LINK GND   -> SAMD21 GND
#   ST-LINK VTref -> target 3.3 V
#
# Optional reset:
#   ST-LINK NRST -> SAMD21 RESET
#
# Do not wire RESET to 5 V.
# Pull SAMD21 RESET to 3.3 V through about 10k if it does not idle high.

set SCRIPT_DIR [file normalize [file dirname [info script]]]
cd $SCRIPT_DIR

set BIN_FILES [lsort [glob -nocomplain *.bin]]

if {[llength $BIN_FILES] == 0} {
    echo "ERROR: no .bin file found next to flash_j18.cfg"
    shutdown
}

set BIN_FILE [lindex $BIN_FILES 0]

# For a full image, no-bootloader image, or Arduino .with_bootloader image:
set FLASH_ADDR 0x00000000

# For an app-only Arduino image linked behind an existing bootloader, use:
# set FLASH_ADDR 0x00002000
#
# If FLASH_ADDR is 0x00002000 and you want to preserve a bootloader,
# do not clear boot protection.

set CLEAR_BOOTPROT 1

echo "============================================================"
echo "SAMD21J18 flash"
echo "BIN_FILE       = $BIN_FILE"
echo "FLASH_ADDR     = $FLASH_ADDR"
echo "CLEAR_BOOTPROT = $CLEAR_BOOTPROT"
echo "============================================================"

source [find interface/stlink.cfg]
transport select hla_swd

adapter speed 200

set CHIPNAME at91samd21j18
source [find target/at91samdXX.cfg]

reset_config none
cortex_m reset_config sysresetreq

init
targets

reset halt

if {$CLEAR_BOOTPROT} {
    echo "Clearing SAMD21 bootloader protection fuse..."
    echo "OpenOCD command: at91samd bootloader 0"
    at91samd bootloader 0

    echo "Resetting after boot protection fuse update..."
    reset halt
}

echo "Probing flash..."
flash probe 0

echo "Programming $BIN_FILE at $FLASH_ADDR..."
program $BIN_FILE verify reset $FLASH_ADDR

echo "Done."
shutdown